<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'DejaVu Sans',Arial,sans-serif">
  <defs>
    <marker id="sig" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#111"/>
    </marker>
    <g id="gnd"><path d="M0,0 V12 M-11,12 H11 M-7,17 H7 M-3,22 H3" fill="none" stroke="#111" stroke-width="2"/></g>
    <g id="tagL"><path d="M0,0 L10,-9 H52 V9 H10 Z" fill="#fff" stroke="#111" stroke-width="1.4"/></g>
    <style>
      .bg{fill:#fff;}
      .frame{fill:none;stroke:#bbb;stroke-width:1;}
      .box{fill:#fff;stroke:#111;stroke-width:2;}
      .h1{font-size:21px;font-weight:bold;fill:#111;}
      .h2{font-size:12px;fill:#444;}
      .title{font-size:14px;font-weight:bold;fill:#111;}
      .sub{font-size:10.5px;fill:#555;}
      .pinL{font-size:12px;fill:#111;}
      .pinR{font-size:12px;fill:#111;text-anchor:end;}
      .w{stroke:#111;stroke-width:2;fill:none;}
      .net{font-size:11px;fill:#111;}
      .netb{font-size:11px;font-weight:bold;fill:#111;}
      .tag{font-size:10px;font-weight:bold;fill:#111;}
      .note{font-size:10.5px;fill:#111;}
      .dot{fill:#111;}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="540"/>
  <rect class="frame" x="8" y="8" width="984" height="524" rx="10"/>
  <text x="24" y="36" class="h1">ESP32-S3 robot voice — wiring</text>
  <text x="24" y="57" class="h2">Freenove ESP32-S3 WROOM Lite → GY-PCM5102A board → XR16 ch 5/6 (stereo).</text>

  <!-- rails -->
  <line class="w" x1="230" y1="100" x2="600" y2="100"/><text x="230" y="92" class="netb">+5V</text>
  <use href="#gnd" x="600" y="470"/>
  <line class="w" x1="195" y1="482" x2="600" y2="482"/><text x="195" y="474" class="netb">GND</text>

  <!-- Freenove ESP32-S3 -->
  <rect class="box" x="40" y="190" width="160" height="230" rx="10"/>
  <text x="120" y="218" text-anchor="middle" class="title">ESP32-S3</text>
  <text x="120" y="235" text-anchor="middle" class="sub">Freenove Lite · “rig-esp”</text>
  <text x="192" y="274" class="pinR">5V</text>
  <text x="192" y="310" class="pinR">GND (1)</text>
  <text x="192" y="350" class="pinR">GPIO5 (5)</text>
  <text x="192" y="390" class="pinR">GPIO6 (6)</text>
  <text x="192" y="412" class="pinR">GPIO7 (7)</text>
  <text x="48" y="438" class="sub">( ) = WROOM-1 module pad</text>

  <!-- PCM5102A board -->
  <rect class="box" x="340" y="190" width="205" height="250" rx="10"/>
  <text x="442" y="218" text-anchor="middle" class="title">PCM5102A board</text>
  <text x="442" y="235" text-anchor="middle" class="sub">GY-PCM5102A</text>
  <text x="352" y="274" class="pinL">VIN</text>
  <text x="352" y="310" class="pinL">GND</text>
  <text x="352" y="350" class="pinL">BCK (13)</text>
  <text x="352" y="390" class="pinL">LCK (15)</text>
  <text x="352" y="412" class="pinL">DIN (14)</text>
  <text x="352" y="434" class="pinL">SCK (12)</text>
  <text x="533" y="290" class="pinR">LROUT (6)</text>
  <text x="533" y="330" class="pinR">ROUT (7)</text>
  <text x="533" y="370" class="pinR">AGND</text>

  <!-- harness -->
  <line class="w" x1="200" y1="270" x2="340" y2="270"/><circle class="dot" cx="340" cy="270" r="3"/>
  <line class="w" x1="230" y1="270" x2="230" y2="100"/><circle class="dot" cx="230" cy="100" r="3"/><circle class="dot" cx="230" cy="270" r="3"/>
  <line class="w" x1="200" y1="306" x2="340" y2="306"/><circle class="dot" cx="340" cy="306" r="3"/>
  <line class="w" x1="215" y1="306" x2="215" y2="482"/><circle class="dot" cx="215" cy="306" r="3"/><circle class="dot" cx="215" cy="482" r="3"/>
  <line class="w" x1="200" y1="346" x2="340" y2="346" marker-end="url(#sig)"/>
  <line class="w" x1="200" y1="386" x2="340" y2="386" marker-end="url(#sig)"/>
  <line class="w" x1="200" y1="408" x2="340" y2="408" marker-end="url(#sig)"/>
  <line class="w" x1="340" y1="430" x2="315" y2="430"/><g transform="translate(261,430)"><use href="#tagL"/></g><text x="273" y="434" class="tag">GND</text>
  <text x="315" y="450" class="sub" text-anchor="end">SCK→GND (onboard jumper)</text>

  <!-- output (stereo L/R) -->
  <line class="w" x1="545" y1="286" x2="640" y2="286" marker-end="url(#sig)"/><circle class="dot" cx="545" cy="286" r="3"/>
  <line class="w" x1="545" y1="326" x2="640" y2="326" marker-end="url(#sig)"/><circle class="dot" cx="545" cy="326" r="3"/>
  <line class="w" x1="545" y1="366" x2="580" y2="366"/><circle class="dot" cx="545" cy="366" r="3"/>
  <line class="w" x1="580" y1="366" x2="580" y2="482"/><circle class="dot" cx="580" cy="482" r="3"/>

  <!-- XR16 -->
  <rect class="box" x="640" y="256" width="170" height="120" rx="10"/>
  <text x="725" y="284" text-anchor="middle" class="title">Behringer XR16</text>
  <text x="725" y="301" text-anchor="middle" class="sub">LINE IN</text>
  <text x="652" y="290" class="net">ch5 L</text>
  <text x="652" y="330" class="net">ch6 R</text>
  <text x="652" y="360" class="sub">stereo vocal bus · fader only</text>

  <!-- minimal notes -->
  <text x="352" y="464" class="sub">( ) = PCM5102A IC pin · VIN = 5 V (onboard 3.3 V LDOs)</text>
  <text x="24" y="512" class="note"><tspan font-weight="bold">Lines:</tspan> solid = signal/power · dashed-tick = GND · ▸ = signal direction.</text>
</svg>
